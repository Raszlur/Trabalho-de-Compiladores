<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compilador Educacional</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #eef2ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90vw, 680px);
        padding: 3rem;
        text-align: center;
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgb(37 49 98 / 15%);
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      .hello {
        margin: 2rem 0 1rem;
        color: #4338ca;
        font-size: clamp(2rem, 8vw, 4rem);
      }

      #status {
        color: #526079;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Compilador Educacional</h1>
      <p>Estrutura inicial do projeto</p>
      <div class="hello" id="message">Carregando...</div>
      <p id="status">Verificando comunicação com o backend...</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
